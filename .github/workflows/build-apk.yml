name: Build Flamingo APK

on:
  push:
    branches: [ master, "**" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk-dist
          find app/build/outputs/apk/ -type f \( -name "*.apk" -o -name "*.ApK" -o -name "*.APK" \) -exec cp {} apk-dist/Flamingo-Overhaul-Debug.apk \;
          ls -lh apk-dist/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Flamingo-Overhaul-Debug-APK
          path: apk-dist/Flamingo-Overhaul-Debug.apk
